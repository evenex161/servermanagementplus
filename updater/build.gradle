plugins {
    id 'java'
}

group = 'com.servermanagement'
version = '2.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.servermanagement.updater.UpdaterMain'
        )
    }
}
