plugins {
    id 'java-library'
    id 'maven-publish'
}
version = "${mod_version}-b${mod_build}"

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

// Declare capabilities on the outgoing configurations
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'forge_version'                : forge_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'mod_version'                  : mod_version,
            'mod_build'                    : mod_build,
            'mod_release_type'             : mod_release_type
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json', 'ota.properties']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url') ?: "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

import java.security.MessageDigest
import javax.crypto.Cipher
import javax.crypto.spec.SecretKeySpec

tasks.register('generateEncryptedKey') {
    dependsOn tasks.named('compileJava')
    
    def outputDir = file("$buildDir/generated/resources/assets/servermanagement")
    def outputFile = file("$outputDir/metrics.dat")
    
    outputs.file(outputFile)
    
    doLast {
        def targetClass = file("$buildDir/classes/java/main/com/servermanagement/ota/CurseForgeUpdateChecker.class")
        
        def localPropsFile = rootProject.file('local.properties')
        def apiKey = "DUMMY_KEY"
        if (localPropsFile.exists()) {
            def props = new Properties()
            localPropsFile.withInputStream { props.load(it) }
            apiKey = props.getProperty('curseforge.api.key', 'DUMMY_KEY')
        }
        
        if (targetClass.exists()) {
            byte[] classBytes = targetClass.readBytes()
            
            MessageDigest digest = MessageDigest.getInstance("SHA-256")
            byte[] hash = digest.digest(classBytes)
            
            byte[] keyBytes = new byte[16]
            System.arraycopy(hash, 0, keyBytes, 0, 16)
            SecretKeySpec secretKey = new SecretKeySpec(keyBytes, "AES")
            
            Cipher cipher = Cipher.getInstance("AES/ECB/PKCS5Padding")
            cipher.init(Cipher.ENCRYPT_MODE, secretKey)
            byte[] encryptedData = cipher.doFinal(apiKey.getBytes("UTF-8"))
            
            outputDir.mkdirs()
            outputFile.bytes = encryptedData
        } else {
            outputDir.mkdirs()
            outputFile.bytes = new byte[0]
        }
    }
}

tasks.named('processResources').configure {
    dependsOn 'generateEncryptedKey'
    from("$buildDir/generated/resources")
}
