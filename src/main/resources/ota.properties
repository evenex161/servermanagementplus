# OTA Version Tracking
# This file is used by the OTA system to detect updates
# Values are substituted by Gradle at build time from gradle.properties

# Version format: MAJOR.MINOR.PATCH
# Build format: Incremental number, zero-padded (reset on version change)

ota.version=v${mod_version}
ota.build=${mod_build}
ota.minecraft_version=${minecraft_version}
ota.mod_loader=${mod_loader}

# Release notes for this build
ota.releaseType=beta
ota.releaseNotes=Dynamic market pricing, supply/demand tracking, margin history, MineBay UX overhaul, performance GUI, 20+ visual fixes

# Previous versions (for rollback support)
ota.previous.version=1.0.3
ota.previous.build=05
